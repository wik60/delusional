<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Delusional Crew order confirmation." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
    <title>Thank you — Delusional Crew</title>
  </head>
  <body class="thank-you-body">
    <header class="thank-you-header">
      <a class="wordmark" href="./index.html">DELUSIONAL</a>
      <a href="./index.html">BACK TO STORE</a>
    </header>

    <main class="thank-you-main">
      <article class="thank-you-card" id="thankYouCard">
        <div class="thank-you-mark">✓</div>
        <h1 id="thankYouTitle">VERIFYING PAYMENT.</h1>
        <p class="thank-you-lead" id="thankYouLead">This will only take a moment.</p>

        <dl class="thank-you-details" id="thankYouDetails" hidden>
          <div><dt>ORDER</dt><dd id="thankYouOrder">—</dd></div>
          <div><dt>PRODUCT</dt><dd id="thankYouProduct">—</dd></div>
          <div><dt>DELIVERY</dt><dd id="thankYouShipping">—</dd></div>
          <div><dt>TOTAL</dt><dd id="thankYouTotal">—</dd></div>
        </dl>

        <p class="thank-you-email" id="thankYouEmail"></p>
        <a class="back-store" href="./index.html">BACK TO STORE</a>
      </article>
    </main>

    <script type="module" src="./src/thank-you.js"></script>
  </body>
</html>
