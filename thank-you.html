<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Potwierdzenie zamówienia Delusional Crew." />
    <meta name="theme-color" content="#ede9e4" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Dziękujemy — Delusional Crew</title>
  </head>
  <body class="thank-you-body">
    <header class="thank-you-header">
      <a href="./index.html" class="brand-logo" aria-label="Delusional Crew — strona główna"><img src="./images/brand-mark.png" alt="" /></a>
      <a href="./index.html">WRÓĆ DO SKLEPU</a>
    </header>
    <main class="thank-you-main">
      <article class="thank-you-card" id="thankYouCard" aria-live="polite">
        <p class="thank-you-index">DELUSIONAL CREW / ORDER</p>
        <div class="thank-you-mark" aria-hidden="true">✓</div>
        <h1 id="thankYouTitle">SPRAWDZAMY PŁATNOŚĆ.</h1>
        <p class="thank-you-lead" id="thankYouLead">To potrwa tylko chwilę.</p>
        <dl class="thank-you-details" id="thankYouDetails" hidden>
          <div><dt>ZAMÓWIENIE</dt><dd id="thankYouOrder">—</dd></div>
          <div><dt>PRODUKT</dt><dd id="thankYouProduct">—</dd></div>
          <div><dt>DOSTAWA</dt><dd id="thankYouShipping">—</dd></div>
          <div><dt>ŁĄCZNIE</dt><dd id="thankYouTotal">—</dd></div>
        </dl>
        <p class="thank-you-email" id="thankYouEmail"></p>
        <a class="button button-dark" href="./index.html">STRONA GŁÓWNA</a>
      </article>
    </main>
    <script type="module" src="./src/thank-you.js"></script>
  </body>
</html>
